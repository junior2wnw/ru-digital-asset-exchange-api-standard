[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spreadx-conformance"
version = "0.2.0"
description = "Conformance tests for the RU-DAX interoperability profile draft."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27",
  "pytest>=8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["spreadx_conformance"]
