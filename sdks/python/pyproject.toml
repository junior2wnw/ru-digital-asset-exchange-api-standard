[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spreadx"
version = "0.5.0"
description = "Python reference client for the RU Digital Market Interoperability Profile draft."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "RU-DMIP contributors" }
]
dependencies = [
  "httpx>=0.27"
]

[project.urls]
Homepage = "https://github.com/junior2wnw/ru-digital-asset-exchange-api-standard"
Specification = "https://github.com/junior2wnw/ru-digital-asset-exchange-api-standard/tree/main/spec"

[tool.hatch.build.targets.wheel]
packages = ["spreadx"]
