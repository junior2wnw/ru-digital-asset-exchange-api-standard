[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spreadx"
version = "0.1.0"
description = "Python SDK reference implementation for the RU Digital Asset Exchange API Standard."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "RU-DAX contributors" }
]
dependencies = [
  "httpx>=0.27"
]

[project.urls]
Homepage = "https://github.com/junior2wnw/ru-digital-asset-exchange-api-standard"
Specification = "https://github.com/junior2wnw/ru-digital-asset-exchange-api-standard/tree/main/spec"

[tool.hatch.build.targets.wheel]
packages = ["spreadx"]

